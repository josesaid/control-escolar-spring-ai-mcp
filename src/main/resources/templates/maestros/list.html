<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Maestros')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<main class="content">
<div th:replace="~{layout :: topbar('Maestros')}"></div>

<div class="mb-3"><a class="btn btn-primary" th:href="@{/maestros/nuevo}"><i class="bi bi-plus-lg"></i> Nuevo maestro</a></div>
<div class="card shadow-sm"><div class="card-body table-responsive">
<table class="table table-striped table-hover"><thead><tr><th>No. empleado</th><th>Nombre</th><th>Email</th><th>Especialidad</th><th>Activo</th><th>Acciones</th></tr></thead>
<tbody><tr th:each="m : ${maestros}">
<td th:text="${m.numeroEmpleado}"></td><td th:text="${m.nombreCompleto}"></td><td th:text="${m.email}"></td><td th:text="${m.especialidad}"></td><td th:text="${m.activo ? 'Si' : 'No'}"></td>
<td><a class="btn btn-sm btn-outline-primary" th:href="@{'/maestros/editar/' + ${m.id}}">Editar</a>
<a class="btn btn-sm btn-outline-danger" th:href="@{'/maestros/eliminar/' + ${m.id}}" onclick="return confirm('Eliminar este maestro?')">Eliminar</a></td>
</tr></tbody></table>
<p class="text-muted" th:if="${#lists.isEmpty(maestros)}">Sin maestros registrados.</p>
</div></div>

</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
