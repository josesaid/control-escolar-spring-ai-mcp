<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Roles y permisos')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<main class="content">
<div th:replace="~{layout :: topbar('Roles y permisos')}"></div>

<div class="row g-3">
<div class="col-md-6"><div class="card shadow-sm"><div class="card-header bg-white fw-bold">Roles</div><div class="card-body">
<table class="table table-sm"><thead><tr><th>Rol</th><th>Descripcion</th></tr></thead>
<tbody><tr th:each="r : ${roles}"><td><span class="badge bg-primary" th:text="${r}"></span></td><td th:text="${r.descripcion}"></td></tr></tbody></table>
<p class="small text-muted">ADMIN: todo. DIRECTOR: reportes y gestion. MAESTRO: calificaciones y horarios. SECRETARIA: alumnos e inscripciones. ALUMNO: solo consulta.</p>
</div></div></div>
<div class="col-md-6"><div class="card shadow-sm"><div class="card-header bg-white fw-bold">Permisos disponibles</div><div class="card-body">
<table class="table table-sm"><thead><tr><th>Permiso</th><th>Descripcion</th></tr></thead>
<tbody><tr th:each="p : ${permisos}"><td><code th:text="${p}"></code></td><td th:text="${p.descripcion}"></td></tr></tbody></table>
</div></div></div>
</div>
<p class="mt-3"><a class="btn btn-primary" th:href="@{/usuarios}">Gestionar usuarios</a></p>

</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
