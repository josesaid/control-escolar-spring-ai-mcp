<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Calificaciones')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<main class="content">
<div th:replace="~{layout :: topbar('Calificaciones')}"></div>

<div class="mb-3 d-flex gap-2"><a class="btn btn-primary" th:href="@{/calificaciones/nuevo}"><i class="bi bi-plus-lg"></i> Nueva calificacion</a>
<a class="btn btn-outline-primary" th:href="@{/reportes}">Ver reportes</a></div>
<div class="alert alert-info" th:if="${promedioAlumno != null}">Promedio del alumno seleccionado: <b th:text="${#numbers.formatDecimal(promedioAlumno,1,2)}"></b></div>
<div class="card shadow-sm"><div class="card-body table-responsive">
<table class="table table-striped table-hover"><thead><tr><th>Alumno</th><th>Materia</th><th>Periodo</th><th>Tipo</th><th>Calificacion</th><th>Fecha</th><th>Acciones</th></tr></thead>
<tbody><tr th:each="c : ${calificaciones}">
<td th:text="${c.alumno != null ? c.alumno.nombreCompleto : '-'}"></td><td th:text="${c.materia != null ? c.materia.nombre : '-'}"></td>
<td th:text="${c.periodo}"></td><td th:text="${c.tipoEvaluacion}"></td>
<td><span class="badge" th:classappend="${c.valor != null and c.valor < 6 ? 'bg-danger' : 'bg-success'}" th:text="${c.valor}"></span></td>
<td th:text="${c.fecha}"></td>
<td><a class="btn btn-sm btn-outline-primary" th:href="@{'/calificaciones/editar/' + ${c.id}}">Editar</a>
<a class="btn btn-sm btn-outline-danger" th:href="@{'/calificaciones/eliminar/' + ${c.id}}" onclick="return confirm('Eliminar esta calificacion?')">Eliminar</a></td>
</tr></tbody></table>
<p class="text-muted" th:if="${#lists.isEmpty(calificaciones)}">Sin calificaciones registradas.</p>
</div></div>

</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
