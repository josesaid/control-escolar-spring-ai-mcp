<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Calificacion')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<main class="content">
<div th:replace="~{layout :: topbar('Calificacion')}"></div>

<div class="card shadow-sm"><div class="card-body">
<form th:action="@{/calificaciones/guardar}" th:object="${calificacion}" method="post">
<input type="hidden" th:field="*{id}"/>
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Alumno</label><select class="form-select" th:field="*{alumno}" required><option value="">-- Elige --</option><option th:each="a : ${alumnos}" th:value="${a.id}" th:text="${a.matricula + ' - ' + a.nombreCompleto}"></option></select></div>
<div class="col-md-6"><label class="form-label">Materia</label><select class="form-select" th:field="*{materia}" required><option value="">-- Elige --</option><option th:each="m : ${materias}" th:value="${m.id}" th:text="${m.nombre}"></option></select></div>
<div class="col-md-4"><label class="form-label">Periodo</label><input class="form-control" th:field="*{periodo}" placeholder="2026-1" required/></div>
<div class="col-md-4"><label class="form-label">Calificacion (0-10)</label><input class="form-control" type="number" step="0.1" min="0" max="10" th:field="*{valor}" required/></div>
<div class="col-md-4"><label class="form-label">Tipo de evaluacion</label><select class="form-select" th:field="*{tipoEvaluacion}"><option value="PARCIAL">Parcial</option><option value="FINAL">Final</option><option value="ORDINARIO">Ordinario</option><option value="EXTRAORDINARIO">Extraordinario</option></select></div>
<div class="col-md-6"><label class="form-label">Fecha</label><input class="form-control" type="date" th:field="*{fecha}"/></div>
<div class="col-md-6"><label class="form-label">Observaciones</label><input class="form-control" th:field="*{observaciones}"/></div>
</div>
<div class="mt-3"><button class="btn btn-primary" type="submit">Guardar</button> <a class="btn btn-secondary" th:href="@{/calificaciones}">Cancelar</a></div>
</form></div></div>

</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
