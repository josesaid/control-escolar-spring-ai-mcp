<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Aulas')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<main class="content">
<div th:replace="~{layout :: topbar('Aulas')}"></div>

<div class="mb-3"><a class="btn btn-primary" th:href="@{/aulas/nuevo}"><i class="bi bi-plus-lg"></i> Nueva aula</a></div>
<div class="card shadow-sm"><div class="card-body table-responsive">
<table class="table table-striped table-hover"><thead><tr><th>Clave</th><th>Nombre</th><th>Capacidad</th><th>Edificio</th><th>Tipo</th><th>Acciones</th></tr></thead>
<tbody><tr th:each="a : ${aulas}">
<td th:text="${a.clave}"></td><td th:text="${a.nombre}"></td><td th:text="${a.capacidad}"></td><td th:text="${a.edificio}"></td><td th:text="${a.tipo}"></td>
<td><a class="btn btn-sm btn-outline-primary" th:href="@{'/aulas/editar/' + ${a.id}}">Editar</a>
<a class="btn btn-sm btn-outline-danger" th:href="@{'/aulas/eliminar/' + ${a.id}}" onclick="return confirm('Eliminar esta aula?')">Eliminar</a></td>
</tr></tbody></table>
<p class="text-muted" th:if="${#lists.isEmpty(aulas)}">Sin aulas registradas.</p>
</div></div>

</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
