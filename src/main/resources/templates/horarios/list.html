<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Horarios')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<main class="content">
<div th:replace="~{layout :: topbar('Horarios')}"></div>

<div class="mb-3"><a class="btn btn-primary" th:href="@{/horarios/nuevo}"><i class="bi bi-plus-lg"></i> Nuevo horario</a></div>
<div class="card shadow-sm"><div class="card-body table-responsive">
<table class="table table-striped table-hover"><thead><tr><th>Dia</th><th>Hora</th><th>Materia</th><th>Grupo</th><th>Maestro</th><th>Aula</th><th>Acciones</th></tr></thead>
<tbody><tr th:each="h : ${horarios}">
<td th:text="${h.diaSemana}"></td><td th:text="${h.horaInicio + ' - ' + h.horaFin}"></td>
<td th:text="${h.materia != null ? h.materia.nombre : '-'}"></td><td th:text="${h.grupo != null ? h.grupo.clave : '-'}"></td>
<td th:text="${h.maestro != null ? h.maestro.nombreCompleto : '-'}"></td><td th:text="${h.aula != null ? h.aula.clave : '-'}"></td>
<td><a class="btn btn-sm btn-outline-primary" th:href="@{'/horarios/editar/' + ${h.id}}">Editar</a>
<a class="btn btn-sm btn-outline-danger" th:href="@{'/horarios/eliminar/' + ${h.id}}" onclick="return confirm('Eliminar este horario?')">Eliminar</a></td>
</tr></tbody></table>
<p class="text-muted" th:if="${#lists.isEmpty(horarios)}">Sin horarios registrados.</p>
</div></div>

</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
