<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Horario')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<main class="content">
<div th:replace="~{layout :: topbar('Horario')}"></div>

<div class="card shadow-sm"><div class="card-body">
<form th:action="@{/horarios/guardar}" th:object="${horario}" method="post">
<input type="hidden" th:field="*{id}"/>
<div class="row g-3">
<div class="col-md-4"><label class="form-label">Materia</label><select class="form-select" th:field="*{materia}" required><option value="">-- Elige --</option><option th:each="m : ${materias}" th:value="${m.id}" th:text="${m.nombre}"></option></select></div>
<div class="col-md-4"><label class="form-label">Maestro</label><select class="form-select" th:field="*{maestro}" required><option value="">-- Elige --</option><option th:each="m : ${maestros}" th:value="${m.id}" th:text="${m.nombreCompleto}"></option></select></div>
<div class="col-md-4"><label class="form-label">Aula</label><select class="form-select" th:field="*{aula}" required><option value="">-- Elige --</option><option th:each="a : ${aulas}" th:value="${a.id}" th:text="${a.clave + ' - ' + a.nombre}"></option></select></div>
<div class="col-md-4"><label class="form-label">Grupo</label><select class="form-select" th:field="*{grupo}" required><option value="">-- Elige --</option><option th:each="g : ${grupos}" th:value="${g.id}" th:text="${g.clave}"></option></select></div>
<div class="col-md-4"><label class="form-label">Dia de la semana</label><select class="form-select" th:field="*{diaSemana}"><option value="LUNES">Lunes</option><option value="MARTES">Martes</option><option value="MIERCOLES">Miercoles</option><option value="JUEVES">Jueves</option><option value="VIERNES">Viernes</option></select></div>
<div class="col-md-2"><label class="form-label">Hora inicio</label><input class="form-control" type="time" th:field="*{horaInicio}" required/></div>
<div class="col-md-2"><label class="form-label">Hora fin</label><input class="form-control" type="time" th:field="*{horaFin}" required/></div>
</div>
<div class="mt-3"><button class="btn btn-primary" type="submit">Guardar</button> <a class="btn btn-secondary" th:href="@{/horarios}">Cancelar</a></div>
</form></div></div>

</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
