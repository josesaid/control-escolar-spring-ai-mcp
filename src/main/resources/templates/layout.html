<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${titulo} + ' | Control Escolar'">Control Escolar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:fragment="sidebar">
  <nav class="sidebar d-flex flex-column p-3">
    <a th:href="@{/dashboard}" class="d-flex align-items-center mb-3 text-white text-decoration-none">
      <i class="bi bi-mortarboard-fill fs-3 me-2"></i><span class="fs-5 fw-bold">Control Escolar</span>
    </a>
    <hr class="text-white"/>
    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item"><a th:href="@{/dashboard}" class="nav-link text-white"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
      <li><a th:href="@{/alumnos}" class="nav-link text-white"><i class="bi bi-people me-2"></i>Alumnos</a></li>
      <li><a th:href="@{/maestros}" class="nav-link text-white"><i class="bi bi-person-badge me-2"></i>Maestros</a></li>
      <li><a th:href="@{/materias}" class="nav-link text-white"><i class="bi bi-book me-2"></i>Materias</a></li>
      <li><a th:href="@{/aulas}" class="nav-link text-white"><i class="bi bi-door-open me-2"></i>Aulas</a></li>
      <li><a th:href="@{/horarios}" class="nav-link text-white"><i class="bi bi-clock me-2"></i>Horarios</a></li>
      <li><a th:href="@{/calificaciones}" class="nav-link text-white"><i class="bi bi-journal-check me-2"></i>Calificaciones</a></li>
      <li><a th:href="@{/reportes}" class="nav-link text-white"><i class="bi bi-bar-chart me-2"></i>Reportes</a></li>
      <li><a th:href="@{/asistente}" class="nav-link text-white"><i class="bi bi-robot me-2"></i>Asistente IA</a></li>
      <li><a th:href="@{/usuarios}" class="nav-link text-white"><i class="bi bi-person-gear me-2"></i>Usuarios</a></li>
      <li><a th:href="@{/roles}" class="nav-link text-white"><i class="bi bi-shield-lock me-2"></i>Roles y permisos</a></li>
    </ul>
    <hr class="text-white"/>
    <div class="text-white small">Usuario: <b sec:authentication="name">usuario</b><br/>Rol: <span sec:authentication="principal.authorities">ROLE</span></div>
    <form th:action="@{/logout}" method="post" class="mt-2"><button class="btn btn-outline-light btn-sm w-100" type="submit"><i class="bi bi-box-arrow-right me-1"></i>Salir</button></form>
  </nav>
</div>
<div th:fragment="topbar(titulo)">
  <div class="topbar d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0" th:text="${titulo}">Titulo</h1>
    <span class="badge bg-primary">Periodo 2026-1</span>
  </div>
</div>
<div th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
