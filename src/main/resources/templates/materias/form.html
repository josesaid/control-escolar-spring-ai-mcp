<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Materia')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<main class="content">
<div th:replace="~{layout :: topbar('Materia')}"></div>

<div class="card shadow-sm"><div class="card-body">
<form th:action="@{/materias/guardar}" th:object="${materia}" method="post">
<input type="hidden" th:field="*{id}"/>
<div class="row g-3">
<div class="col-md-4"><label class="form-label">Clave</label><input class="form-control" th:field="*{clave}" required/></div>
<div class="col-md-8"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" required/></div>
<div class="col-md-12"><label class="form-label">Descripcion</label><input class="form-control" th:field="*{descripcion}"/></div>
<div class="col-md-4"><label class="form-label">Creditos</label><input class="form-control" type="number" th:field="*{creditos}"/></div>
<div class="col-md-4"><label class="form-label">Horas por semana</label><input class="form-control" type="number" th:field="*{horasSemana}"/></div>
<div class="col-md-4"><label class="form-label">Maestro</label><select class="form-select" th:field="*{maestro}"><option value="">-- Sin asignar --</option><option th:each="m : ${maestros}" th:value="${m.id}" th:text="${m.nombreCompleto}"></option></select></div>
</div>
<div class="mt-3"><button class="btn btn-primary" type="submit">Guardar</button> <a class="btn btn-secondary" th:href="@{/materias}">Cancelar</a></div>
</form></div></div>

</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
