<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Materias')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<main class="content">
<div th:replace="~{layout :: topbar('Materias')}"></div>

<div class="mb-3"><a class="btn btn-primary" th:href="@{/materias/nuevo}"><i class="bi bi-plus-lg"></i> Nueva materia</a></div>
<div class="card shadow-sm"><div class="card-body table-responsive">
<table class="table table-striped table-hover"><thead><tr><th>Clave</th><th>Nombre</th><th>Creditos</th><th>Horas/semana</th><th>Maestro</th><th>Acciones</th></tr></thead>
<tbody><tr th:each="m : ${materias}">
<td th:text="${m.clave}"></td><td th:text="${m.nombre}"></td><td th:text="${m.creditos}"></td><td th:text="${m.horasSemana}"></td><td th:text="${m.maestro != null ? m.maestro.nombreCompleto : '-'}"></td>
<td><a class="btn btn-sm btn-outline-primary" th:href="@{'/materias/editar/' + ${m.id}}">Editar</a>
<a class="btn btn-sm btn-outline-danger" th:href="@{'/materias/eliminar/' + ${m.id}}" onclick="return confirm('Eliminar esta materia?')">Eliminar</a></td>
</tr></tbody></table>
<p class="text-muted" th:if="${#lists.isEmpty(materias)}">Sin materias registradas.</p>
</div></div>

</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
