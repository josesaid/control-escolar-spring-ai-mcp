<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Ingresar | Control Escolar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="card shadow p-4" style="width:420px;max-width:92vw">
    <div class="text-center mb-3"><i class="bi bi-mortarboard-fill fs-1 text-primary"></i>
      <h2 class="h4 mt-2">Control Escolar</h2><p class="text-muted">Ingresa con tu usuario y contrasena</p></div>
    <div th:if="${param.error}" class="alert alert-danger">Usuario o contrasena incorrectos.</div>
    <div th:if="${param.logout}" class="alert alert-success">Sesion cerrada correctamente.</div>
    <form th:action="@{/login}" method="post">
      <div class="mb-3"><label class="form-label">Usuario</label><input class="form-control" type="text" name="username" required autofocus/></div>
      <div class="mb-3"><label class="form-label">Contrasena</label><input class="form-control" type="password" name="password" required/></div>
      <button class="btn btn-primary w-100" type="submit">Entrar</button>
    </form>
    <hr/><p class="small text-muted mb-0">Prueba: <b>admin / admin123</b> &nbsp;|&nbsp; maestro / maestro123 &nbsp;|&nbsp; alumno / alumno123</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
