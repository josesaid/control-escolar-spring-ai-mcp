<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Usuario')}"></head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<main class="content">
<div th:replace="~{layout :: topbar('Usuario')}"></div>

<div class="card shadow-sm"><div class="card-body">
<form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
<input type="hidden" th:field="*{id}"/>
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Usuario</label><input class="form-control" th:field="*{username}" required/></div>
<div class="col-md-6"><label class="form-label">Contrasena (dejala en blanco al editar si no cambia; en nuevo es obligatoria)</label><input class="form-control" type="password" th:field="*{password}"/></div>
<div class="col-md-6"><label class="form-label">Nombre completo</label><input class="form-control" th:field="*{nombreCompleto}" required/></div>
<div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" th:field="*{email}"/></div>
<div class="col-md-6"><label class="form-label">Rol</label><select class="form-select" th:field="*{rol}"><option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option></select></div>
<div class="col-md-6"><label class="form-label">Activo</label><select class="form-select" th:field="*{activo}"><option value="true">Si</option><option value="false">No</option></select></div>
<div class="col-md-12"><label class="form-label">Permisos</label><select class="form-select" multiple="multiple" size="5" th:field="*{permisos}"><option th:each="p : ${permisos}" th:value="${p}" th:text="${p}"></option></select><small class="text-muted">Ctrl/Cmd + clic para elegir varios.</small></div>
</div>
<div class="mt-3"><button class="btn btn-primary" type="submit">Guardar</button> <a class="btn btn-secondary" th:href="@{/usuarios}">Cancelar</a></div>
</form></div></div>

</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
