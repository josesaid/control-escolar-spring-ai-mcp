server.port=8080
spring.application.name=control-escolar

# H2 (desarrollo)
spring.datasource.url=jdbc:h2:mem:controlescolar
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MCP Server (Spring AI)
spring.ai.mcp.server.name=control-escolar-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.annotation-scanner.enabled=true

# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:demo}
spring.ai.openai.chat.options.model=gpt-4o-mini

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.org.springframework.ai=INFO

# Actuator
management.endpoints.web.exposure.include=health,info

