server.port=8080
spring.application.name=control-escolar

# H2 (desarrollo)
spring.datasource.url=jdbc:h2:mem:controlescolar
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MCP Server (Spring AI)
spring.ai.mcp.server.name=control-escolar-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.annotation-scanner.enabled=true
spring.ai.mcp.server.capabilities.completion=true
spring.ai.mcp.server.instructions=Servidor MCP del sistema de control escolar: tools de consulta de alumnos, calificaciones, asistencia, horarios, maestros, aulas, reportes y reglamento; recursos escolar:// y prompts de análisis.

# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:demo}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.embedding.options.model=text-embedding-3-small

# Memoria del chat (Spring AI): tabla SPRING_AI_CHAT_MEMORY en la misma BD
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# Asistente IA: palabras que bloquea el SafeGuardAdvisor (separadas por coma).
# Escapes \uXXXX porque Spring Boot lee este archivo en ISO-8859-1.
escolar.ia.palabras-bloqueadas=contrase\u00f1a,password,tarjeta de cr\u00e9dito,CURP

# Observabilidad de Spring AI (métricas de tokens, latencia y tools)
spring.ai.chat.client.observations.log-prompt=false
spring.ai.chat.client.observations.log-completion=false
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.org.springframework.ai=INFO
# DEBUG muestra peticiones y respuestas del SimpleLoggerAdvisor
logging.level.org.springframework.ai.chat.client.advisor=INFO

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

